# Independent HTTP-only ingress. Never overwrite the old site's config.
# Public demo data only: port 80 does not encrypt shared tokens/health records.
user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
# Do not record Authorization headers, request bodies, query strings, or tokens.
# Startup syntax errors still go to the `nginx -t` process stderr.
error_log /dev/null;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;

    map $http_upgrade $gateway_connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        absolute_redirect off;
        client_max_body_size 26m;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gateway_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        # Streaming avoids spilling a 25-MiB upload into a smaller tmpfs.
        # The inner /api/ proxy must likewise disable request buffering.
        proxy_request_buffering off;
        proxy_send_timeout 30s;

        location = /zhiwei {
            return 308 /zhiwei/$is_args$args;
        }

        location ^~ /zhiwei/ {
            # Trailing slash removes /zhiwei/ before forwarding.
            # /zhiwei/api/... -> /api/...; /zhiwei/_nuxt/... -> /_nuxt/...
            proxy_pass http://127.0.0.1:8080/;
            proxy_read_timeout 210s;
        }

        location / {
            # No URI suffix: preserve the old site's root/API/assets/WS paths.
            # Its existing 3000 container/volume/listener remain untouched.
            proxy_pass http://127.0.0.1:3000;
            proxy_read_timeout 3600s;
        }
    }
}
