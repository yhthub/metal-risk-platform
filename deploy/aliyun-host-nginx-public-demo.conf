# PUBLIC, anonymous demonstration profile for the user's existing Aliyun site.
# Render the INTERNAL app token only into the private server configuration.
# Never put this token in static assets, client requests, or response headers.
user zhiwei;
worker_processes 1;
pid /data/zhiwei/runtime/nginx/run/nginx.pid;
error_log /dev/null;

events {
    worker_connections 256;
}

http {
    map_hash_bucket_size 128;
    types {
        text/html html htm;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/webp webp;
        image/avif avif;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
        font/ttf ttf;
        font/otf otf;
        application/pdf pdf;
        text/plain txt;
        video/mp4 mp4;
    }
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_body_temp_path /data/zhiwei/runtime/nginx/tmp/client_body;
    proxy_temp_path /data/zhiwei/runtime/nginx/tmp/proxy;
    fastcgi_temp_path /data/zhiwei/runtime/nginx/tmp/fastcgi;
    uwsgi_temp_path /data/zhiwei/runtime/nginx/tmp/uwsgi;
    scgi_temp_path /data/zhiwei/runtime/nginx/tmp/scgi;

    map $http_upgrade $zhiwei_connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_origin $zhiwei_origin_allowed {
        default 0;
        "" 1;
        "http://8.148.158.242" 1;
    }
    map $http_origin $zhiwei_cors_origin {
        default "";
        "http://8.148.158.242" "http://8.148.158.242";
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        absolute_redirect off;
        client_max_body_size 26m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zhiwei_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The original website must retain the client's own Authorization header.
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_send_timeout 30s;

        location = /zhiwei { return 308 /zhiwei/$is_args$args; }
        location = /zhiwei/api { return 404; }
        location = /zhiwei/uploads { return 404; }
        location ^~ /zhiwei/uploads/ { return 404; }
        location = /zhiwei/docs { return 404; }
        location ^~ /zhiwei/docs/ { return 404; }
        location = /zhiwei/redoc { return 404; }
        location ^~ /zhiwei/redoc/ { return 404; }
        location = /zhiwei/openapi.json { return 404; }
        location ^~ /zhiwei/. { return 404; }

        location ^~ /zhiwei/api/ {
            if ($zhiwei_origin_allowed = 0) { return 403; }
            if ($request_method = OPTIONS) { return 204; }
            add_header Access-Control-Allow-Origin $zhiwei_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Vary Origin always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            # Location-level proxy_set_header replaces the inherited header set.
            # Repeat every header here rather than silently dropping old settings.
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $zhiwei_connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "Bearer __ZHIWEI_ACCESS_TOKEN__";
            proxy_pass http://127.0.0.1:18000/api/;
            proxy_read_timeout 210s;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
        }

        location ^~ /zhiwei/_nuxt/ {
            alias /data/zhiwei/releases/site_20261011_001/public_demo_20261011_001/my-nuxt-app/.output/public/_nuxt/;
            autoindex off;
            expires 7d;
            add_header X-Content-Type-Options nosniff always;
        }
        location ^~ /zhiwei/ {
            alias /data/zhiwei/releases/site_20261011_001/public_demo_20261011_001/my-nuxt-app/.output/public/;
            autoindex off;
            index index.html;
            try_files $uri $uri/ @zhiwei_spa;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location @zhiwei_spa {
            root /data/zhiwei/releases/site_20261011_001/public_demo_20261011_001/my-nuxt-app/.output/public;
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_read_timeout 3600s;
        }
    }
}
